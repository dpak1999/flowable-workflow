<section class="workspace" aria-labelledby="workflows-title">
  <div class="workspace-header">
    <div>
      <p class="eyebrow">Workflows</p>
      <h1 id="workflows-title">Workflow table</h1>
    </div>

    <p-button label="Add workflow" (onClick)="openAddWorkflowDialog()" />
  </div>

  @if (errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }

  <p-table
    [value]="workflows()"
    [loading]="isLoading()"
    [tableStyle]="{ 'min-width': '42rem' }"
    styleClass="workflow-table"
  >
    <ng-template #header>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Created</th>
        <th aria-label="Actions"></th>
      </tr>
    </ng-template>

    <ng-template #body let-workflow>
      <tr class="workflow-row" tabindex="0" (click)="openWorkflow(workflow)" (keydown.enter)="openWorkflow(workflow)">
        <td>{{ workflow.id }}</td>
        <td>{{ workflow.name }}</td>
        <td>{{ workflow.createdAt | date: 'medium' }}</td>
        <td class="actions-cell">
          <button
            class="icon-button"
            type="button"
            [disabled]="deletingWorkflowId() === workflow.id"
            aria-label="Delete workflow"
            title="Delete workflow"
            (click)="deleteWorkflow(workflow, $event)"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm1 6h2v9h-2V9Zm4 0h2v9h-2V9ZM7 9h2v10h6V9h2v12H7V9Z" />
            </svg>
          </button>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">No workflows yet.</td>
      </tr>
    </ng-template>
  </p-table>
</section>

<p-dialog
  header="Add workflow"
  [modal]="true"
  [visible]="showAddWorkflowDialog()"
  [style]="{ width: 'min(92vw, 28rem)' }"
  (visibleChange)="showAddWorkflowDialog.set($event)"
>
  <form class="workflow-form" (ngSubmit)="saveWorkflow()">
    <label for="workflow-name">Name</label>
    <input
      id="workflow-name"
      pInputText
      type="text"
      autocomplete="off"
      [formControl]="workflowName"
      autofocus
    />

    @if (workflowName.invalid && workflowName.touched) {
      <p class="field-error">Enter a workflow name.</p>
    }

    <div class="dialog-actions">
      <p-button label="Cancel" severity="secondary" [outlined]="true" type="button" (onClick)="closeAddWorkflowDialog()" />
      <p-button label="Save" type="submit" [loading]="isSaving()" />
    </div>
  </form>
</p-dialog>
